name: Import coursework
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract prepared coursework
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from hashlib import sha256
          archive = Path('coursework-import.zip')
          expected = 'dbe5383b2d44a7097bb710461cfe48ee1d60b4e783b4ecdda16b340a3d4150e4'
          assert sha256(archive.read_bytes()).hexdigest() == expected
          with ZipFile(archive) as source:
              for name in source.namelist():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert '.git' not in path.parts and '.github' not in path.parts
              source.extractall('.')
          archive.unlink()
          PY
      - name: Check Python work
        run: |
          python -m pip install -r requirements.txt
          python run_checks.py
      - name: Save course files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add Python coursework and reports for variant 17"
          git push
